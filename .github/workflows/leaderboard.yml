name: Update leaderboard

on:
  schedule:
    - cron: "7 * * * *"   # hourly
  workflow_dispatch:
  discussion:
    types: [created, edited, deleted, labeled, unlabeled, closed, reopened]

permissions:
  contents: write
  discussions: read

concurrency:
  group: leaderboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build data/posts.json and data/top100.json
        run: node scripts/build-data.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit data
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "gitgather-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "chore(data): update leaderboard"
            git pull --rebase --autostash origin main
            git push
          else
            echo "No changes"
          fi
