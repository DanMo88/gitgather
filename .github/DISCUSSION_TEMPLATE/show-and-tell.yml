title: "[Showcase] "
labels: ["showcase"]
body:
  - type: markdown
    attributes:
      value: |
        ## 🚀 Showcase your project on Gitgather
        Your post appears on https://danmo88.github.io/gitgather/ within about an hour.
        People can react 👍 ❤️ 🚀 and comment here or on the site. Please be kind and follow the [Code of Conduct](https://github.com/DanMo88/gitgather/blob/main/CODE_OF_CONDUCT.md).
        **No star-for-star requests, please.** Posts asking for star swaps are removed.
  - type: input
    id: repo
    attributes:
      label: Project repository URL
      description: The public GitHub repository you want to showcase.
      placeholder: https://github.com/owner/repo
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: Short title
      description: One line that says what it is.
      placeholder: A tiny CLI that turns Markdown into slides
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What does it do, why did you build it, what feedback do you want?
    validations:
      required: true
  - type: input
    id: tags
    attributes:
      label: Tags
      description: Comma-separated, e.g. rust, cli, open-source
      placeholder: javascript, pwa, tools
    validations:
      required: false
  - type: input
    id: screenshot
    attributes:
      label: Screenshot URL
      description: Optional image URL (https). You can also drag an image into the description.
      placeholder: https://raw.githubusercontent.com/owner/repo/main/screenshot.png
    validations:
      required: false
